<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HIT FOR HIT™ Live Voting</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    text-align:center;
}

.header{
    background:#ff0000;
    padding:25px 15px;
    border-bottom:6px solid #fff;
}

.header h1{
    margin:0;
    font-size:34px;
    font-weight:1000;
    letter-spacing:3px;
}

.header p{
    margin:8px 0 0;
    font-size:18px;
    font-weight:800;
}


.container{

    max-width:500px;
    margin:35px auto;
    padding:20px;

}


.card{

    background:#111;
    border:4px solid #fff;
    padding:25px;
    box-shadow:0 0 25px rgba(255,0,0,.5);

}


.battle-title{

    background:#ff0000;
    color:#fff;
    padding:18px;
    font-size:26px;
    font-weight:1000;
    text-transform:uppercase;
    margin-bottom:25px;

}


.vote-btn{

    width:100%;
    padding:25px;
    margin:15px 0;
    font-size:24px;
    font-weight:1000;
    text-transform:uppercase;
    border:none;
    cursor:pointer;

}

.vote-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none !important;
}


.artist-a{

    background:#fff;
    color:#000;

}


.artist-b{

    background:#ff0000;
    color:#fff;

}


.vote-btn:not(:disabled):hover{

    transform:scale(1.03);

}


.status{

    margin-top:25px;
    padding:18px;
    background:#000;
    border:3px solid #ff0000;
    color:#fff;
    font-size:18px;
    font-weight:900;
    text-transform:uppercase;

}


.closed{

    border-color:#555;
    color:#ff0000;

}


.footer{

    margin-top:50px;
    padding:20px;
    background:#111;
    color:#fff;
    font-size:14px;
    font-weight:800;
    border-top:4px solid #ff0000;

}

.artist-card img{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #fff;
  margin:20px auto;
}
</style>

</head>


<body>


<div class="header">

<h1>
HIT FOR HIT™
</h1>

<p>
LIVE AUDIENCE VOTING
</p>

</div>



<div class="container" id="battleContainer">

</div>



<div class="artist-card">

<img id="photoA" src="" alt="Artist A" style="display:none;">

<h2 id="nameA">ARTIST A</h2>

<button 
class="vote-btn artist-a"
id="btnA"
onclick="vote('A')"
disabled>
VOTE
</button>

<p id="votesA">0 VOTES</p>

</div>


<div class="artist-card">

<img id="photoB" src="" alt="Artist B" style="display:none;">

<h2 id="nameB">ARTIST B</h2>

<button 
class="vote-btn artist-b"
id="btnB"
onclick="vote('B')"
disabled>
VOTE
</button>

<p id="votesB">0 VOTES</p>

</div>



<div id="status" class="status">

WAITING FOR VOTING...

</div>


</div>


</div>



<div class="footer">

HIT FOR HIT BATTLES™ | STV RADIOMELTDOWN

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCNdyRTEynhQTm4BqspOxpOaC8twHeod6w",
  authDomain: "h4h-walkie.firebaseapp.com",
  projectId: "h4h-walkie",
  storageBucket: "h4h-walkie.firebasestorage.app",
  messagingSenderId: "253773392789",
  appId: "1:253773392789:web:27b1141ffa1f1b7815a49c"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const battles = [
  "qualifier_1",
  "qualifier_2",
  "qualifier_3"
];


const container = document.getElementById("battleContainer");


function hasVoted(id){
  return localStorage.getItem("h4h_vote_" + id);
}


function renderBattle(id,data){

let box = document.getElementById(id);

if(!box){

box = document.createElement("div");

box.className="card";

box.id=id;

container.appendChild(box);

}


box.innerHTML = `

<div class="battle-title">
${data.round || "QUALIFIER BATTLE"}
</div>


<div class="artist-card">

<img 
src="${data.artistA.photo || ''}"
style="${data.artistA.photo ? '' : 'display:none'}">

<h2>${data.artistA.name}</h2>

<button 
class="vote-btn artist-a"
onclick="vote('${id}','A')">

VOTE ${data.artistA.name}

</button>

<p>${data.artistA.votes || 0} VOTES</p>

</div>


<div class="artist-card">

<img 
src="${data.artistB.photo || ''}"
style="${data.artistB.photo ? '' : 'display:none'}">

<h2>${data.artistB.name}</h2>

<button 
class="vote-btn artist-b"
onclick="vote('${id}','B')">

VOTE ${data.artistB.name}

</button>

<p>${data.artistB.votes || 0} VOTES</p>

</div>


<div class="status">

${data.status === "live" ? "VOTING IS LIVE" : "VOTING CLOSED"}

</div>

`;


if(data.status !== "live" || hasVoted(id)){

box.querySelectorAll("button").forEach(btn=>{
btn.disabled=true;
});

}

}



battles.forEach((id)=>{


const battleRef = doc(db,"h4h_battles",id);


onSnapshot(battleRef,(snap)=>{


if(snap.exists()){

renderBattle(id,snap.data());

}


});


});



window.vote = async function(id,choice){


if(hasVoted(id)){

alert("You already voted in this battle");

return;

}


const battleRef = doc(db,"h4h_battles",id);


const field = choice==="A"
? "artistA.votes"
: "artistB.votes";


await updateDoc(
battleRef,
{
[field]: increment(1)
}
);


localStorage.setItem(
"h4h_vote_"+id,
choice
);


alert("Vote counted!");

};


</script>
