<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HIT FOR HIT™ Live Voting</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    text-align:center;
}

.header{
    background:#ff0000;
    padding:25px 15px;
    border-bottom:6px solid #fff;
}

.header h1{
    margin:0;
    font-size:34px;
    font-weight:1000;
    letter-spacing:3px;
}

.header p{
    margin:8px 0 0;
    font-size:18px;
    font-weight:800;
}


.container{

    max-width:500px;
    margin:35px auto;
    padding:20px;

}


.card{

    background:#111;
    border:4px solid #fff;
    padding:25px;
    box-shadow:0 0 25px rgba(255,0,0,.5);

}


.battle-title{

    background:#ff0000;
    color:#fff;
    padding:18px;
    font-size:26px;
    font-weight:1000;
    text-transform:uppercase;
    margin-bottom:25px;

}


.vote-btn{

    width:100%;
    padding:25px;
    margin:15px 0;
    font-size:24px;
    font-weight:1000;
    text-transform:uppercase;
    border:none;
    cursor:pointer;

}


.artist-a{

    background:#fff;
    color:#000;

}


.artist-b{

    background:#ff0000;
    color:#fff;

}


.vote-btn:hover{

    transform:scale(1.03);

}


.status{

    margin-top:25px;
    padding:18px;
    background:#000;
    border:3px solid #ff0000;
    color:#fff;
    font-size:18px;
    font-weight:900;
    text-transform:uppercase;

}


.closed{

    border-color:#555;
    color:#ff0000;

}


.footer{

    margin-top:50px;
    padding:20px;
    background:#111;
    color:#fff;
    font-size:14px;
    font-weight:800;
    border-top:4px solid #ff0000;

}


</style>

</head>


<body>


<div class="header">

<h1>
HIT FOR HIT™
</h1>

<p>
LIVE AUDIENCE VOTING
</p>

</div>



<div class="container">


<div class="card">


<div class="battle-title" id="battleTitle">
LOADING BATTLE...
</div>



<button 
class="vote-btn artist-a"
id="btnA"
onclick="vote('A')">

ARTIST A

</button>



<button 
class="vote-btn artist-b"
id="btnB"
onclick="vote('B')">

ARTIST B

</button>



<div id="status" class="status">

WAITING FOR VOTING...

</div>


</div>


</div>



<div class="footer">

HIT FOR HIT BATTLES™ | STV RADIOMELTDOWN

</div>


</body>
</html>
