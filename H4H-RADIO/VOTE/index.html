<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HIT FOR HIT™ Live Voting</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    text-align:center;
}

.header{
    background:#ff0000;
    padding:25px 15px;
    border-bottom:6px solid #fff;
}

.header h1{
    margin:0;
    font-size:34px;
    font-weight:1000;
    letter-spacing:3px;
}

.header p{
    margin:8px 0 0;
    font-size:18px;
    font-weight:800;
}


.container{

    max-width:500px;
    margin:35px auto;
    padding:20px;

}


.card{

    background:#111;
    border:4px solid #fff;
    padding:25px;
    box-shadow:0 0 25px rgba(255,0,0,.5);

}


.battle-title{

    background:#ff0000;
    color:#fff;
    padding:18px;
    font-size:26px;
    font-weight:1000;
    text-transform:uppercase;
    margin-bottom:25px;

}


.vote-btn{

    width:100%;
    padding:25px;
    margin:15px 0;
    font-size:24px;
    font-weight:1000;
    text-transform:uppercase;
    border:none;
    cursor:pointer;

}

.vote-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none !important;
}


.artist-a{

    background:#fff;
    color:#000;

}


.artist-b{

    background:#ff0000;
    color:#fff;

}


.vote-btn:not(:disabled):hover{

    transform:scale(1.03);

}


.status{

    margin-top:25px;
    padding:18px;
    background:#000;
    border:3px solid #ff0000;
    color:#fff;
    font-size:18px;
    font-weight:900;
    text-transform:uppercase;

}


.closed{

    border-color:#555;
    color:#ff0000;

}


.footer{

    margin-top:50px;
    padding:20px;
    background:#111;
    color:#fff;
    font-size:14px;
    font-weight:800;
    border-top:4px solid #ff0000;

}

.artist-card img{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #fff;
  margin:20px auto;
}
</style>

</head>


<body>


<div class="header">

<h1>
HIT FOR HIT™
</h1>

<p>
LIVE AUDIENCE VOTING
</p>

</div>



<div class="container" id="battleContainer">

</div>



<div class="artist-card">

<img id="photoA" src="" alt="Artist A" style="display:none;">

<h2 id="nameA">ARTIST A</h2>

<button 
class="vote-btn artist-a"
id="btnA"
onclick="vote('A')"
disabled>
VOTE
</button>

<p id="votesA">0 VOTES</p>

</div>


<div class="artist-card">

<img id="photoB" src="" alt="Artist B" style="display:none;">

<h2 id="nameB">ARTIST B</h2>

<button 
class="vote-btn artist-b"
id="btnB"
onclick="vote('B')"
disabled>
VOTE
</button>

<p id="votesB">0 VOTES</p>

</div>



<div id="status" class="status">

WAITING FOR VOTING...

</div>


</div>


</div>



<div class="footer">

HIT FOR HIT BATTLES™ | STV RADIOMELTDOWN

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  onSnapshot,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCNdyRTEynhQTm4BqspOxpOaC8twHeod6w",
  authDomain: "h4h-walkie.firebaseapp.com",
  projectId: "h4h-walkie",
  storageBucket: "h4h-walkie.firebasestorage.app",
  messagingSenderId: "253773392789",
  appId: "1:253773392789:web:27b1141ffa1f1b7815a49c"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const battleRef = doc(db, "h4h_battles", "qualifier_1");

let battleData = null;
let currentBattleId = null;

/* Falls back to a round+name signature if the staff page hasn't been
   updated to send battleId yet, so this still works either way. */
function getBattleId(data){
  if(data.battleId) return data.battleId;
  return (data.round || '') + '|' + (data.artistA?.name || '') + '|' + (data.artistB?.name || '');
}

function hasVotedFor(battleId){
  return localStorage.getItem('h4h_voted_' + battleId);
}

function markVoted(battleId, choice){
  localStorage.setItem('h4h_voted_' + battleId, choice);
}

function refreshButtons(){
  const btnA = document.getElementById('btnA');
  const btnB = document.getElementById('btnB');
  const statusEl = document.getElementById('status');

  if(!battleData){
    btnA.disabled = true;
    btnB.disabled = true;
    return;
  }

  const isLive = battleData.status === 'live';
  const alreadyVoted = hasVotedFor(currentBattleId);

  if(!isLive){
    btnA.disabled = true;
    btnB.disabled = true;
    statusEl.textContent = battleData.status === 'closed' ? 'VOTING CLOSED' : 'WAITING FOR VOTING...';
    statusEl.classList.toggle('closed', battleData.status === 'closed');
  } else if(alreadyVoted){
    btnA.disabled = true;
    btnB.disabled = true;
    statusEl.textContent = 'YOU ALREADY VOTED FOR THIS BATTLE';
    statusEl.classList.remove('closed');
  } else {
    btnA.disabled = false;
    btnB.disabled = false;
    statusEl.textContent = 'VOTING IS LIVE — TAP TO VOTE';
    statusEl.classList.remove('closed');
  }
}

function renderBattle(data){
  battleData = data;
  currentBattleId = getBattleId(data);

  document.getElementById('battleTitle').textContent =
    (data.round || 'BATTLE') + ' ROUND';

  document.getElementById('nameA').textContent = data.artistA?.name || 'ARTIST A';
  document.getElementById('nameB').textContent = data.artistB?.name || 'ARTIST B';

  const photoA = document.getElementById('photoA');
  const photoB = document.getElementById('photoB');
  if(data.artistA?.photo){ photoA.src = data.artistA.photo; photoA.style.display = 'inline-block'; }
  else { photoA.style.display = 'none'; }
  if(data.artistB?.photo){ photoB.src = data.artistB.photo; photoB.style.display = 'inline-block'; }
  else { photoB.style.display = 'none'; }

  document.getElementById('votesA').textContent = (data.artistA?.votes || 0) + ' VOTES';
  document.getElementById('votesB').textContent = (data.artistB?.votes || 0) + ' VOTES';

  refreshButtons();
}

onSnapshot(battleRef, (snap)=>{
  if(!snap.exists()){
    document.getElementById('battleTitle').textContent = 'NO BATTLE FOUND';
    document.getElementById('status').textContent = 'NO ACTIVE BATTLE';
    document.getElementById('btnA').disabled = true;
    document.getElementById('btnB').disabled = true;
    return;
  }
  renderBattle(snap.data());
}, (err)=>{
  console.error('battle listener error', err);
  document.getElementById('status').textContent = 'CONNECTION ERROR — TRY REFRESHING';
});

window.vote = async function(choice){

  if(!battleData || battleData.status !== 'live') return;
  if(hasVotedFor(currentBattleId)) return;

  const field = choice === 'A' ? 'artistA.votes' : 'artistB.votes';

  // Lock the buttons immediately so a double-tap can't slip through
  // before the write finishes.
  markVoted(currentBattleId, choice);
  refreshButtons();

  try{
    await updateDoc(battleRef, { [field]: increment(1) });
    document.getElementById('status').textContent = 'VOTE COUNTED — THANK YOU!';
  }catch(err){
    console.error('vote failed', err);
    // Roll back the local lock so they can try again if the write failed.
    localStorage.removeItem('h4h_voted_' + currentBattleId);
    refreshButtons();
    alert('Vote failed to send — check your connection and try again.');
  }

};

</script>
</body>
</html>
