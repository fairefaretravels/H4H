<script>
/* ===================== HERO PHOTO ROTATION ===================== */
const PHOTOS = [
  { src:'STAFF/H4Hpromo.PNG' },

<script>
/* ===================== PROMO RADIO — LOCAL SHUFFLE, NO SYNC =====================
   No Firebase, no driver/listener handoff. Every visitor's browser independently:
   1. Asks GitHub what audio files currently sit in STAFF/MIXTAPE
   2. Shuffles that list
   3. Plays through it, auto-advancing on 'ended', reshuffling when the list runs out
   Drop new files into STAFF/MIXTAPE on GitHub and they show up automatically —
   nothing here needs to change. This is a promo mix, not a live shared broadcast. */
const GITHUB_OWNER = 'fairefaretravels';
const GITHUB_REPO = 'H4H';
const GITHUB_BRANCH = 'main';
const MIXTAPE_PATH = 'STAFF';
const AUDIO_EXT = ['mp3','wav','m4a','ogg','aac','flac'];
const REFRESH_MS = 60000;

let TRACKS = [];       // full list as fetched
let PLAY_QUEUE = [];   // shuffled order for this session
let queueIdx = 0;
let playing = false;
let currentTrack = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

async function fetchMixtapeFiles(){
  try{
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${MIXTAPE_PATH}?ref=${GITHUB_BRANCH}`,
      { headers: { 'Accept': 'application/vnd.github+json' } }
    );
    if(!res.ok) throw new Error('GitHub API error ' + res.status);
    const data = await res.json();
    return data
      .filter(file => file.type === 'file' && AUDIO_EXT.includes((file.name.split('.').pop() || '').toLowerCase()))
      .sort((a,b)=>a.name.localeCompare(b.name))
      .map(file => ({ name: file.name, url: file.download_url }));
  }catch(error){
    console.error('Could not load STAFF/MIXTAPE from GitHub', error);
    return null;
  }
}

async function radioInit(){
  const fetched = await fetchMixtapeFiles();
  TRACKS = fetched || [];
  PLAY_QUEUE = shuffle(TRACKS);
  queueIdx = 0;
  updateIdleUi(fetched === null);

  const audio = document.getElementById('radioAudio');
  audio.addEventListener('ended', ()=>{ if(playing) advance(); });

  setInterval(async ()=>{
    const fresh = await fetchMixtapeFiles();
    if(fresh === null) return;
    const changed = JSON.stringify(fresh.map(t=>t.name)) !== JSON.stringify(TRACKS.map(t=>t.name));
    if(changed){
      TRACKS = fresh;
      PLAY_QUEUE = shuffle(TRACKS);
      queueIdx = 0;
    }
  }, REFRESH_MS);
}

function updateIdleUi(fetchFailed){
  const title = document.getElementById('nowTitle');
  const sub = document.getElementById('nowSub');
  if(fetchFailed){
    title.textContent = 'Could not load the mix';
    sub.textContent = 'Try refreshing the page';
  } else {
    title.textContent = TRACKS.length ? 'Nothing on air yet' : 'No tracks in the mix yet';
    sub.textContent = TRACKS.length ? TRACKS.length+' track(s) ready — tap Tune In' : 'Check back soon';
  }
}

function updateUi(track, isLive){
  const btn = document.getElementById('tuneBtn');
  const lbl = document.getElementById('tuneLabel');
  const tag = document.getElementById('onairTag');
  const disc = document.getElementById('disc');
  const title = document.getElementById('nowTitle');
  const sub = document.getElementById('nowSub');

  btn.classList.toggle('on', playing);
  lbl.textContent = playing ? 'STOP' : 'TUNE IN';

  if(track){
    const idx = PLAY_QUEUE.findIndex(t=>t.url===track.url);
    title.textContent = track.name;
    sub.textContent = isLive ? 'Playing now' : 'Loading…';
    tag.textContent = isLive ? 'ON AIR' : 'BUFFERING';
    tag.classList.toggle('live', isLive);
    disc.classList.toggle('spin', isLive);
  } else {
    updateIdleUi(false);
    tag.textContent = 'STANDBY';
    tag.classList.remove('live');
    disc.classList.remove('spin');
  }
}

async function playCurrent(){
  if(!PLAY_QUEUE.length){
    PLAY_QUEUE = shuffle(TRACKS);
    queueIdx = 0;
  }
  if(!PLAY_QUEUE.length){
    alert('No tracks in the promo mix yet.');
    playing = false;
    updateUi(null, false);
    return;
  }
  const track = PLAY_QUEUE[queueIdx];
  currentTrack = track;
  const audio = document.getElementById('radioAudio');
  audio.src = track.url;
  audio.currentTime = 0;
  updateUi(track, false);
  try{
    await audio.play();
    updateUi(track, true);
  }catch(err){
    console.error('Playback failed', err);
    updateUi(track, false);
  }
}

function advance(){
  queueIdx++;
  if(queueIdx >= PLAY_QUEUE.length){
    PLAY_QUEUE = shuffle(TRACKS);
    queueIdx = 0;
  }
  playCurrent();
}

function skipTrack(){
  if(!playing) return;
  advance();
}

function tuneToggle(){
  if(playing){
    stopLocal();
    return;
  }
  playing = true;
  playCurrent();
}

function stopLocal(){
  const audio = document.getElementById('radioAudio');
  audio.pause();
  audio.currentTime = 0;
  playing = false;
  currentTrack = null;
  updateUi(null, false);
}

function setVolume(v){
  const audio = document.getElementById('radioAudio');
  audio.volume = v/100; audio.muted = false;
  document.getElementById('muteBtn').textContent = (v==0) ? 'MUTED' : 'MUTE';
}
function toggleMute(){
  const audio = document.getElementById('radioAudio');
  audio.muted = !audio.muted;
  document.getElementById('muteBtn').textContent = audio.muted ? 'MUTED' : 'MUTE';
}

window.tuneToggle = tuneToggle;
window.skipTrack = skipTrack;
window.toggleMute = toggleMute;
window.setVolume = setVolume;

radioInit();
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyCNdyRTEynhQTm4BqspOxpOaC8twHeod6w",
  authDomain:"h4h-walkie.firebaseapp.com",
  projectId:"h4h-walkie",
  storageBucket:"h4h-walkie.firebasestorage.app",
  messagingSenderId:"253773392789",
  appId:"1:253773392789:web:27b1141ffa1f1b7815a49c"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

async function sset(key, val){
  try{ await set(ref(db, key), val); return val; }
  catch(e){ console.error('firebase set failed', key, e); return null; }
}
async function sget(key){
  try{
    const snap = await get(ref(db, key));
    return snap.exists() ? snap.val() : null;
  }catch(e){ console.error('firebase get failed', key, e); return null; }
}

/* ================= H4H ARTIST CHECK-IN — shared across all devices ================= */
const ARTIST_QUEUE_KEY = 'h4h_artist_queue';
let artistQueue = [];

async function loadArtistQueue(){
  const fresh = await sget(ARTIST_QUEUE_KEY);
  artistQueue = fresh || [];
  renderArtistQueue();
}

async function artistCheckIn(){
  let name = document.getElementById("checkArtistName").value.trim();
  if(!name){ return; }

  const fresh = await sget(ARTIST_QUEUE_KEY);
  artistQueue = fresh || [];
  artistQueue.push({ name:name, time:new Date().toLocaleTimeString(), ready:false });

  await sset(ARTIST_QUEUE_KEY, artistQueue);

  document.getElementById("checkArtistName").value="";
  document.getElementById("checkMessage").innerHTML = name+" is checked in";

  renderArtistQueue();
}

async function buzzArtist(index){
  const fresh = await sget(ARTIST_QUEUE_KEY);
  artistQueue = fresh || artistQueue;
  if(!artistQueue[index]) return;

  artistQueue[index].ready=true;
  await sset(ARTIST_QUEUE_KEY, artistQueue);
  renderArtistQueue();
}

function renderArtistQueue(){
  let box=document.getElementById("artistQueue");
  if(!box) return;
  if(!artistQueue.length){
    box.innerHTML="No artists checked in.";
    return;
  }
  box.innerHTML = artistQueue.map((artist,index)=>`
    <div class="artist-row">
      <div><b>${artist.name}</b><br><small>${artist.time}</small></div>
      <button onclick="buzzArtist(${index})">${artist.ready ? "BUZZED" : "BUZZ"}</button>
    </div>
  `).join("");
}

loadArtistQueue();
setInterval(loadArtistQueue, 4000);

/* ================= TRACK VOTING — shared vote counts, per-device "already voted" flag ================= */
const H4H_TRACKS = [
  { id:"track001", artist:"Artist A", song:"My New Song", votes:0 },
  { id:"track002", artist:"Artist B", song:"Battle Anthem", votes:0 }
];

const TRACK_VOTES_KEY = 'h4h_track_votes';

function hasVotedLocally(id){
  const voted = JSON.parse(localStorage.getItem("h4h_track_votes_local")) || [];
  return voted.includes(id);
}
function markVotedLocally(id){
  const voted = JSON.parse(localStorage.getItem("h4h_track_votes_local")) || [];
  voted.push(id);
  localStorage.setItem("h4h_track_votes_local", JSON.stringify(voted));
}

async function loadTrackVotes(){
  const counts = (await sget(TRACK_VOTES_KEY)) || {};
  H4H_TRACKS.forEach(t => { t.votes = counts[t.id] || 0; });
  renderVoting();
  renderLeaderboard();
}

function renderVoting(){
  let box=document.getElementById("trackVoting");
  if(!box) return;
  box.innerHTML = H4H_TRACKS.map(track=>`
    <div class="track-row">
      <div><b>${track.artist}</b><br>${track.song}</div>
      <button onclick="voteTrack('${track.id}')">VOTE (${track.votes})</button>
    </div>
  `).join("");
}

function renderLeaderboard(){
  let box=document.getElementById("leaderboard");
  if(!box) return;
  let sorted = [...H4H_TRACKS].sort((a,b)=>b.votes-a.votes);
  box.innerHTML = sorted.slice(0,10).map((t,i)=>`
    <div class="track-row">
      <div>#${i+1} ${t.artist}<br>${t.song}</div>
      <div>${t.votes}</div>
    </div>
  `).join("");
}

async function voteTrack(id){
  if(hasVotedLocally(id)){
    alert("You already voted for this track");
    return;
  }
  const counts = (await sget(TRACK_VOTES_KEY)) || {};
  counts[id] = (counts[id] || 0) + 1;
  await sset(TRACK_VOTES_KEY, counts);

  markVotedLocally(id);
  H4H_TRACKS.forEach(t => { t.votes = counts[t.id] || 0; });

  renderVoting();
  renderLeaderboard();
}

loadTrackVotes();
setInterval(loadTrackVotes, 4000);

/* ================= CROWN VOTE ================= */
const CROWN_VOTE_KEY = 'h4h_crown_votes';
const CROWN_VOTED_LOCAL_KEY = 'h4h_crown_voted_local';

async function loadCrownVotes(){
  const counts = (await sget(CROWN_VOTE_KEY)) || {artistA:0, artistB:0};
  const aEl = document.getElementById('artistACount');
  const bEl = document.getElementById('artistBCount');
  if(aEl) aEl.textContent = counts.artistA || 0;
  if(bEl) bEl.textContent = counts.artistB || 0;
}

async function vote(which){
  if(localStorage.getItem(CROWN_VOTED_LOCAL_KEY)){
    document.getElementById('voteMessage').textContent = "You already voted for the crown.";
    return;
  }
  const counts = (await sget(CROWN_VOTE_KEY)) || {artistA:0, artistB:0};
  counts[which] = (counts[which] || 0) + 1;
  await sset(CROWN_VOTE_KEY, counts);
  localStorage.setItem(CROWN_VOTED_LOCAL_KEY, which);
  document.getElementById('voteMessage').textContent = "Vote recorded!";
  loadCrownVotes();
}

loadCrownVotes();
setInterval(loadCrownVotes, 4000);

window.artistCheckIn = artistCheckIn;
window.buzzArtist = buzzArtist;
window.voteTrack = voteTrack;
window.vote = vote;
</script>
