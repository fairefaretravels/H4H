<style>
:root{
  --ink:#14100D;
  --ink2:#0D0A08;
  --panel:#211A16;
  --panel2:#2B221C;
  --line:#3A2E26;
  --rust:#B0472A;

  --chalk-dim:#DCD3C6;
  --font-display:'Bebas Neue', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, #241a13 0%, transparent 45%),
    radial-gradient(circle at 100% 10%, #1c130d 0%, transparent 40%),

button{font-family:var(--font-body);cursor:pointer;}
a{color:var(--amber);}

.grain{
  position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.05;
  background-image:repeating-linear-gradient(0deg, #fff 0px, transparent 1px, transparent 2px);
  mix-blend-mode:overlay;
}

/* ---------- menu dropdown ---------- */
.menu-wrap{position:fixed;top:14px;right:14px;z-index:100;}
.menu-toggle{
  display:flex;align-items:center;gap:7px;
  background:linear-gradient(135deg, var(--ember), var(--gold));
  color:var(--ink);border:none;border-radius:10px;

  box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.15) inset;
}
.menu-toggle:hover{filter:brightness(1.08);}
.menu-toggle .bars{font-size:14px;line-height:1;}
.menu-dropdown{
  display:none;position:absolute;top:calc(100% + 8px);right:0;left:auto;
  min-width:210px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 26px rgba(0,0,0,.5);overflow:hidden;z-index:9999;
}
.menu-dropdown.show{display:block;}
.menu-item{
  display:block;padding:12px 16px;color:var(--chalk);text-decoration:none;background:none;border:none;
  border-bottom:1px solid var(--line);width:100%;text-align:left;cursor:pointer;

}
.menu-item:last-child{border-bottom:none;}
.menu-item:hover{background:rgba(244,196,48,.1);color:var(--amber);}

<script type="module">

import {initializeApp}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set,
get,
update,
onValue
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyCNdyRTEynhQTm4BqspOxpOaC8twHeod6w",
authDomain:"h4h-walkie.firebaseapp.com",
projectId:"h4h-walkie",
storageBucket:"h4h-walkie.firebasestorage.app",
messagingSenderId:"253773392789",
appId:"1:253773392789:web:27b1141ffa1f1b7815a49c"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

/* ===================== STORAGE HELPERS — Firebase-backed, same call shape as before =====================
   Drop-in replacement for the old window.storage helpers: same sset(key,val)/sget(key) signatures,
   so none of the radio driver/listener/sync logic below needed to change — only the backend did. */
async function sset(key, val){
  try{ await set(ref(db, key), val); return val; }
  catch(e){ console.error('firebase set failed', key, e); return null; }
}
async function sget(key){
  try{
    const snap = await get(ref(db, key));
    return snap.exists() ? snap.val() : null;
  }catch(e){ console.error('firebase get failed', key, e); return null; }
}

/* ===================== HELPERS ===================== */
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ===================== RADIO STATION — auto-pulls whatever audio is in the GitHub STAFF folder ===================== */
/* No hardcoded track list: on load (and every 60s after) this asks GitHub what files currently
   sit in /STAFF, filters to audio files, and uses those directly. Drop a new mp3/wav/m4a into
   STAFF/ on GitHub and it shows up here on its own — nothing in this file needs to change.
   The first person to hit Tune In becomes the "driver" and runs the shared clock; everyone else
   who taps Tune In joins as a listener synced to that same clock. Auto-advance on track end plays
   the next track immediately (no countdown) so the browser's autoplay permission carries over from
   the still-active playback instead of being rejected. */
const GITHUB_OWNER = 'fairefaretravels';
const GITHUB_REPO = 'H4H';
const GITHUB_BRANCH = 'main';
const STAFF_PATH = 'STAFF';
const AUDIO_EXT = ['mp3','wav','m4a','ogg','aac','flac'];
const RADIO_COUNTDOWN_MS = 3000;
const RADIO_REFRESH_MS = 60000;

let RADIO_TRACKS = []; // [{name, url}]
let radioPlaying = false;
let radioIsDriver = false;
let radioCurrentTrack = null;
let radioHeartbeatTimer = null;
let radioSyncTimer = null;
let radioHandledCountdownTs = null;


async function fetchStaffAudioFiles(){

  try{

    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${STAFF_PATH}?ref=${GITHUB_BRANCH}`,
      {
        headers:{
          'Accept':'application/vnd.github+json'
        }
      }
    );

    if(!res.ok){
      throw new Error('GitHub API error ' + res.status);
    }

    const data = await res.json();

    return data
      .filter(file =>
        file.type === 'file' &&
        AUDIO_EXT.includes(
          (file.name.split('.').pop() || '').toLowerCase()
        )
      )
      .sort((a,b)=>a.name.localeCompare(b.name))
      .map(file => ({
        name:file.name,
        url:`STAFF/${encodeURIComponent(file.name)}`
      }));

  }catch(error){

    console.error(
      "Could not load STAFF folder from GitHub",
      error
    );

    return null;

  }

}


async function radioInit(){

  const fetched = await fetchStaffAudioFiles();

  RADIO_TRACKS = fetched || [];

  console.log(RADIO_TRACKS);
  alert("Tracks found: " + RADIO_TRACKS.length);

  updateRadioNowBox();


  if(fetched === null){

    document.getElementById('radioNowPlaying').textContent =
      "Couldn't reach STAFF folder.";

  }


  const audio = document.getElementById('radioAudio');


  audio.addEventListener('ended',()=>{

    if(radioPlaying && radioIsDriver){

      radioDriverNext();

    }

  });


  radioSyncLoop();


  setInterval(async()=>{

    const fresh = await fetchStaffAudioFiles();

    if(fresh === null) return;


    const changed =
      JSON.stringify(fresh.map(t=>t.name)) !==
      JSON.stringify(RADIO_TRACKS.map(t=>t.name));


    if(changed){

      RADIO_TRACKS = fresh;

      console.log(
        "TRACK LIST UPDATED:",
        RADIO_TRACKS
      );

    }


  }, RADIO_REFRESH_MS);


}
  const fetched = await fetchStaffAudioFiles();
  RADIO_TRACKS = fetched || [];
  
  console.log(RADIO_TRACKS);
  
  updateRadioNowBox();
  if(fetched === null){
    document.getElementById('radioNowPlaying').textContent = "Couldn't reach the STAFF folder on GitHub — try refreshing.";
  }
  const audio = document.getElementById('radioAudio');
  audio.addEventListener('ended', ()=>{
    if(radioPlaying && radioIsDriver) radioDriverNext();
  });
  radioSyncLoop();
  setInterval(async ()=>{
    const fresh = await fetchStaffAudioFiles();
    if(fresh === null) return;
    const changed = JSON.stringify(fresh.map(t=>t.name)) !== JSON.stringify(RADIO_TRACKS.map(t=>t.name));
    if(changed){
      RADIO_TRACKS = fresh;
    }
  }, RADIO_REFRESH_MS);
}

/* Only the current track is shown — no queue/list */
function updateRadioNowBox(){
  const box = document.getElementById('radioNowBox');
  const title = document.getElementById('radioNowTitle');
  const status = document.getElementById('radioNowStatus');
  if(!box) return;
  if(radioCurrentTrack){
    box.classList.toggle('live', radioPlaying);
    title.textContent = radioCurrentTrack.name;
    status.textContent = radioPlaying ? 'On air now' : 'Loading…';
  } else {
    box.classList.remove('live');
    title.textContent = 'Nothing on air yet';
    status.textContent = RADIO_TRACKS.length ? RADIO_TRACKS.length+' track(s) ready — tap Tune In' : 'No tracks in STAFF yet';
  }
}

async function radioToggle(){
  if(radioPlaying){ radioStopLocal(); return; }
  if(!RADIO_TRACKS.length){ alert('No tracks in the STAFF folder yet.'); return; }
  const state = await sget('radio_state');
  if(state && state.phase && state.phase !== 'idle' && state.track){
    radioJoinListener(state);
  } else {
    radioBecomeDriverAndStart(RADIO_TRACKS[0]);
  }
}
function radioStopLocal(){
  const wasDriver = radioIsDriver;
  radioPlaying = false;
  radioIsDriver = false;
  const audio = document.getElementById('radioAudio');
  audio.pause(); audio.removeAttribute('src'); audio.load();
  radioStopHeartbeat();
  if(wasDriver){ sset('radio_state', {track:null, phase:'idle', position:0, anchorTs:Date.now(), countdownTargetTs:null}); }
  radioCurrentTrack = null;
  updateRadioUi(null, false);
}

/* ---- DRIVER: owns the clock, used for the *first* Tune In (needs the countdown so joining
   listeners can sync up before playback starts) ---- */
async function radioBecomeDriverAndStart(track){
  radioIsDriver = true;
  radioPlaying = true;
  const targetTs = Date.now() + RADIO_COUNTDOWN_MS;
  const audio = document.getElementById('radioAudio');
  audio.src = track.url;
  audio.currentTime = 0;
  radioCurrentTrack = track;
  await sset('radio_state', {track, phase:'countdown', position:0, anchorTs:Date.now(), countdownTargetTs:targetTs});
  radioRunCountdown(targetTs, 'Going live: '+track.name);
  updateRadioUi(track, false);
  setTimeout(()=>{
    audio.play().then(async ()=>{
      updateRadioUi(track, true);
      await sset('radio_state', {track, phase:'live', position:0, anchorTs:targetTs, countdownTargetTs:null});
      radioStartHeartbeat();
    }).catch(async ()=>{
      alert('Could not play "'+track.name+'" — the file may not be a direct audio link.');
      await sset('radio_state', {track:null, phase:'idle', position:0, anchorTs:Date.now(), countdownTargetTs:null});
      radioStopLocal();
    });
  }, Math.max(0, targetTs - Date.now()));
}

/* ---- auto-advance: plays the next track immediately, no countdown — keeps the browser's
   autoplay permission chain intact so it doesn't get silently blocked ---- */
async function radioPlayImmediately(track){
  radioIsDriver = true;
  radioPlaying = true;
  const audio = document.getElementById('radioAudio');
  radioCurrentTrack = track;
  audio.src = track.url;
  audio.currentTime = 0;
  updateRadioUi(track, false);
  try{
    await audio.play();
    updateRadioUi(track, true);
    await sset('radio_state', {track, phase:'live', position:0, anchorTs:Date.now(), countdownTargetTs:null});
    radioStartHeartbeat();
  }catch(err){
    console.error('Auto-advance play failed, retrying', err);
    setTimeout(()=>{ audio.play().catch(e=>console.error('radio retry failed', e)); }, 300);
  }
}
function radioDriverNext(){
  if(!RADIO_TRACKS.length) return;
  const curIdx = radioCurrentTrack ? RADIO_TRACKS.findIndex(t=>t.url===radioCurrentTrack.url) : -1;
  const nextIdx = curIdx>-1 ? (curIdx+1) % RADIO_TRACKS.length : 0;
  radioPlayImmediately(RADIO_TRACKS[nextIdx]);
}
function radioStartHeartbeat(){
  radioStopHeartbeat();
  radioHeartbeatTimer = setInterval(()=>{
    if(!radioPlaying || !radioIsDriver) return;
    const audio = document.getElementById('radioAudio');
    sset('radio_state', {track:radioCurrentTrack, phase:'live', position:audio.currentTime, anchorTs:Date.now(), countdownTargetTs:null});
  }, 4000);
}
function radioStopHeartbeat(){
  if(radioHeartbeatTimer){ clearInterval(radioHeartbeatTimer); radioHeartbeatTimer=null; }
}

/* ---- LISTENER: joins an already-live broadcast and syncs to it ---- */
async function radioJoinListener(state){
  radioIsDriver = false;
  radioPlaying = true;
  const audio = document.getElementById('radioAudio');
  if(state.phase === 'live'){
    audio.src = state.track.url;
    const expected = state.position + (Date.now()-state.anchorTs)/1000;
    audio.currentTime = Math.max(0, expected);
    radioCurrentTrack = state.track;
    await audio.play().catch(()=>{});
    updateRadioUi(state.track, true);
  } else if(state.phase === 'countdown'){
    audio.src = state.track.url;
    audio.currentTime = state.position || 0;
    radioCurrentTrack = state.track;
    radioHandledCountdownTs = state.countdownTargetTs;
    radioRunCountdown(state.countdownTargetTs, 'Get ready: '+state.track.name);
    setTimeout(()=>{ audio.currentTime = state.position||0; audio.play().catch(()=>{}); }, Math.max(0, state.countdownTargetTs - Date.now()));
    updateRadioUi(state.track, false);
  }
}

/* ---- shared sync loop: keeps listeners locked to the driver's clock ---- */
function radioSyncLoop(){
  radioSyncTimer = setInterval(async ()=>{
    const state = await sget('radio_state');
    if(radioIsDriver) return;

    if(!state || state.phase==='idle' || !state.track){
      if(radioPlaying) radioStopLocal();
      updateRadioIdleHint(null);
      return;
    }
    if(!radioPlaying){
      updateRadioIdleHint(state);
      return;
    }
    const audio = document.getElementById('radioAudio');
    if(state.phase==='countdown'){
      if(radioHandledCountdownTs !== state.countdownTargetTs){
        radioHandledCountdownTs = state.countdownTargetTs;
        audio.src = state.track.url;
        audio.currentTime = state.position || 0;
        radioCurrentTrack = state.track;
        radioRunCountdown(state.countdownTargetTs, 'Get ready: '+state.track.name);
        setTimeout(()=>{ audio.currentTime = state.position||0; audio.play().catch(()=>{}); }, Math.max(0, state.countdownTargetTs - Date.now()));
        updateRadioUi(state.track, false);
      }
      return;
    }
    const changedTrack = !radioCurrentTrack || radioCurrentTrack.url !== state.track.url;
    const expected = state.position + (Date.now()-state.anchorTs)/1000;
    if(changedTrack){
      radioCurrentTrack = state.track;
      audio.src = state.track.url;
      audio.currentTime = Math.max(0, expected);
      audio.play().catch(()=>{});
      updateRadioUi(state.track, true);
      return;
    }
    if(Math.abs(audio.currentTime - expected) > 1.2){ audio.currentTime = Math.max(0, expected); }
  }, 1500);
}
function radioRunCountdown(targetTs, label){
  const el = document.getElementById('radioNowPlaying');
  if(!el) return;
  const render = ()=>{
    const remaining = Math.ceil((targetTs - Date.now())/1000);
    if(remaining<=0) return false;
    el.textContent = '⏳ '+label+' in '+remaining+'…';
    return true;
  };
  if(!render()) return;
  const iv = setInterval(()=>{ if(!render()) clearInterval(iv); }, 200);
}
function updateRadioIdleHint(state){
  const now = document.getElementById('radioNowPlaying');
  if(!now) return;
  if(state && state.track){
    now.textContent = '🔴 Live now: '+state.track.name+' — tap Tune In to join';
  } else {
    now.textContent = RADIO_TRACKS.length ? RADIO_TRACKS.length+' track(s) in STAFF — tap Tune In to start' : 'Nothing in STAFF yet';
  }
}
function updateRadioUi(track, isLive){
  const btn = document.getElementById('radioTuneBtn');
  const lbl = document.getElementById('radioTuneLabel');
  const now = document.getElementById('radioNowPlaying');
  if(btn) btn.classList.toggle('on', radioPlaying);
  if(lbl) lbl.textContent = radioPlaying ? (radioIsDriver ? 'STOP' : 'LEAVE') : 'TUNE IN';
  if(now && track){
    const idx = RADIO_TRACKS.findIndex(t=>t.url===track.url);
    now.textContent = (isLive ? '🔴 On air: ' : '⏳ Loading: ') + track.name + (idx>-1 ? ' ('+(idx+1)+' of '+RADIO_TRACKS.length+')' : '');
  } else if(now && !radioPlaying){
    updateRadioIdleHint(null);
  }
  updateRadioNowBox();
}

/* Module scripts don't expose top-level functions on window automatically — the inline
   onclick="radioToggle()" attribute needs this to find the function. */
window.radioToggle = radioToggle;

/* boot the radio */
radioInit();

/* ================= BATTLE CONTROL (same Firebase app/db as the radio above) ================= */
window.startVote=async()=>{
let A=
document.getElementById("artistA").value;
let B=
document.getElementById("artistB").value;
await set(
ref(db,"battle/current"),
{
artistA:A,
artistB:B,
votesA:0,
votesB:0,
open:true
});
}
window.closeVote=async()=>{
await update(
ref(db,"battle/current"),
{
open:false
});
}
onValue(
ref(db,"battle/current"),
(snapshot)=>{
let data=snapshot.val();
if(!data)return;
aName.innerHTML=data.artistA;
bName.innerHTML=data.artistB;
votesA.innerHTML=
"🅰️ "+data.votesA+" Votes";
votesB.innerHTML=
"🅱️ "+data.votesB+" Votes";
if(!data.open){
if(data.votesA > data.votesB){
winner.innerHTML=
"🏆 WINNER: "+data.artistA;
}
else if(data.votesB > data.votesA){
winner.innerHTML=
"🏆 WINNER: "+data.artistB;
}
else{
winner.innerHTML=
"🤝 TIE";
}
}
});
</script>
