<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>H4H Live Voting</title>

<style>

body{
    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.box{
    background:#111;
    border-radius:15px;
    padding:25px;
    margin:20px auto;
    max-width:400px;
}

button{
    width:100%;
    padding:18px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
}

.vote1{
    background:#ffcc00;
}

.vote2{
    background:#008cff;
    color:white;
}

#status{
    color:#00ff66;
}

</style>

</head>


<body>


<h1>
🏆 HIT FOR HIT BATTLES™
</h1>

<h2>
LIVE AUDIENCE VOTE
</h2>



<div class="box">


<h2 id="battle">
Loading battle...
</h2>


<button class="vote1" onclick="vote(1)" id="btn1">
Artist 1
</button>


<button class="vote2" onclick="vote(2)" id="btn2">
Artist 2
</button>


<p id="status">
Waiting...
</p>


</div>



<script type="module">


import { initializeApp }
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,
ref,
onValue,
update,
get

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {

apiKey:"AIzaSyCNdyRTEynhQTm4BqspOxpOaC8twHeod6w",

authDomain:"h4h-walkie.firebaseapp.com",

projectId:"h4h-walkie",

storageBucket:"h4h-walkie.firebasestorage.app",

messagingSenderId:"253773392789",

appId:"1:253773392789:web:27b1141ffa1f1b7815a49c"

};



const app=initializeApp(firebaseConfig);

const db=getDatabase(app);



let battle;



onValue(
ref(db,"battle/current"),
(snapshot)=>{


battle=snapshot.val();


if(!battle) return;


document.getElementById("battle").innerHTML =
battle.artist1 + " VS " + battle.artist2;


document.getElementById("btn1").innerHTML =
"🎵 "+battle.artist1;


document.getElementById("btn2").innerHTML =
"🎵 "+battle.artist2;



if(!battle.open){

document.getElementById("status").innerHTML=
"Voting Closed";

document.getElementById("btn1").disabled=true;

document.getElementById("btn2").disabled=true;

}


});


window.vote = async function(choice){


let voted =
localStorage.getItem("h4h_voted");


if(voted){

alert("You already voted!");

return;

}



if(!battle.open){

alert("Voting is closed");

return;

}



if(choice===1){

await update(
ref(db,"battle/current"),
{
votes1:
battle.votes1 + 1
});

}


if(choice===2){

await update(
ref(db,"battle/current"),
{
votes2:
battle.votes2 + 1
});

}



localStorage.setItem(
"h4h_voted",
"yes"
);


document.getElementById("status").innerHTML=
"✅ Vote Counted";


}


</script>


</body>
</html>
