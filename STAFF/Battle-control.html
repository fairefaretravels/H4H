<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>H4H Battle Control</title>

<style>

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

h1{
    color:#ffcc00;
    text-align:center;
}

.box{
    background:#111;
    border:1px solid #333;
    border-radius:15px;
    padding:20px;
    margin:15px 0;
}

button{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

.start{
    background:#00cc66;
}

.stop{
    background:#ff0033;
    color:white;
}

.vote{
    background:#008cff;
    color:white;
}

.score{
    font-size:30px;
    text-align:center;
}

</style>

</head>


<body>


<h1>
🏆 HIT FOR HIT BATTLES™
<br>
LIVE CONTROL
</h1>


<div class="box">

<h2>Current Battle</h2>


<label>
Artist 1
</label>

<input id="artist1" placeholder="Artist Name">


<br><br>


<label>
Artist 2
</label>

<input id="artist2" placeholder="Artist Name">


<button class="start" onclick="startBattle()">
🚀 START VOTING
</button>


<button class="stop" onclick="stopBattle()">
🛑 CLOSE VOTING
</button>


</div>



<div class="box">


<h2>LIVE SCORE</h2>


<div class="score">

<span id="name1">
Artist 1
</span>

<br>

<span id="score1">
0
</span>


<br><br>


<span id="name2">
Artist 2
</span>

<br>

<span id="score2">
0
</span>


</div>


</div>



<script type="module">


import { initializeApp }
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,
ref,
set,
onValue

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {

apiKey: "AIzaSyCNdyRTEynhQTm4BqspOxpOaC8twHeod6w",

authDomain:"h4h-walkie.firebaseapp.com",

projectId:"h4h-walkie",

storageBucket:"h4h-walkie.firebasestorage.app",

messagingSenderId:"253773392789",

appId:"1:253773392789:web:27b1141ffa1f1b7815a49c"

};



const app = initializeApp(firebaseConfig);

const db = getDatabase(app);



window.startBattle = async function(){


let a1 =
document.getElementById("artist1").value;


let a2 =
document.getElementById("artist2").value;


await set(
ref(db,"battle/current"),
{

artist1:a1,
artist2:a2,
votes1:0,
votes2:0,
open:true

});


alert("Voting Started");


}



window.stopBattle = async function(){


await set(
ref(db,"battle/current/open"),
false
);


alert("Voting Closed");


}



onValue(
ref(db,"battle/current"),
(snapshot)=>{


const data=snapshot.val();


if(data){


document.getElementById("name1").innerHTML=data.artist1;

document.getElementById("name2").innerHTML=data.artist2;


document.getElementById("score1").innerHTML=data.votes1;

document.getElementById("score2").innerHTML=data.votes2;


}


});


</script>


</body>
</html>
