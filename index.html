<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIT FOR HIT RADIO</title>
<link rel="icon" type="image/png" href="H4Hpromo.PNG">
<style>
body{
    margin:0;
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
}
.container{
    width:100%;
    max-width:800px;
    text-align:center;
    padding:20px;
}
.slideshow{
    width:100%;
    max-width:700px;
    margin:0 auto 30px;
}
.slideshow img{
    width:100%;
    border-radius:15px;
    display:none;
}
.slideshow img.active{
    display:block;
}
.btn{
    display:inline-block;
    margin:12px;
    padding:18px 50px;
    background:red;
    color:white;
    font-size:26px;
    font-weight:bold;
    text-decoration:none;
    border-radius:50px;
    box-shadow:0 0 20px red;
}
.btn:hover{
    background:white;
    color:red;
}
.btn-pay{
    background:#00c853;
    box-shadow:0 0 20px #00c853;
}
.btn-pay:hover{
    background:white;
    color:#00c853;
}
</style>
</head>
<body>
<div class="container">
<div class="slideshow">
<img class="slide active" src="H4Hpromo.PNG" alt="HIT FOR HIT Promo">
<img class="slide" src="3vs3.PNG" alt=" 3 BATTLES 1 STAGE">
</div>
<a class="btn" href="H4H-RADIO/VOTE/">
VOTE
</a>
<a class="btn" href="H4H-RADIO/">
ENTER
</a>
<a class="btn btn-pay" href="https://www.paypal.com/ncp/payment/7WLWBFT93HBLA" target="_blank" rel="noopener">
PAY
</a>
<a class="btn btn-pay" href="https://cash.app/$MOREFIRE" target="_blank" rel="noopener">
CASH APP
</a>
</div>
<script>
let slides = document.querySelectorAll(".slide");
let current = 0;
setInterval(() => {
    slides[current].classList.remove("active");
    current = (current + 1) % slides.length;
    slides[current].classList.add("active");
}, 4000);
</script>
</body>
</html>
